<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1d2e">
<title>English Tutor - 패턴 200 훈련</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 홈 화면 -->
<div id="screen-home" class="screen">
  <header class="home-header">
    <h1>English Tutor <small style="font-size:12px;color:#9aa3c0">v7</small></h1>
    <button id="btn-settings" class="icon-btn" title="설정">&#9881;</button>
  </header>
  <div class="day-card">
    <div class="day-label">오늘의 학습</div>
    <div class="day-num" id="home-day">Day 1</div>
    <div id="home-plan" class="day-plan"></div>
  </div>
  <button id="btn-start" class="big-btn">학습 시작</button>
  <div id="home-warning" class="warning"></div>
</div>

<!-- 학습 화면 -->
<div id="screen-practice" class="screen hidden">
  <header class="practice-header">
    <span id="ph-day"></span>
    <span id="ph-session"></span>
    <span id="ph-progress"></span>
  </header>
  <div class="status-card">
    <div id="mic-indicator" class="mic hidden"><span class="pulse"></span>듣고 있어요...</div>
    <div id="status-main"></div>
    <div id="status-sub"></div>
  </div>
  <div class="controls">
    <button id="btn-back" class="ctl-btn">이전</button>
    <button id="btn-skip" class="ctl-btn">건너뛰기</button>
    <button id="btn-pause" class="ctl-btn">일시정지</button>
    <button id="btn-quit" class="ctl-btn danger">종료</button>
  </div>
</div>

<!-- 설정 화면 -->
<div id="screen-settings" class="screen hidden">
  <header class="home-header">
    <h1>설정</h1>
    <button id="btn-settings-close" class="icon-btn">&#10005;</button>
  </header>
  <label class="field">
    <span>AI 엔진</span>
    <select id="input-engine">
      <option value="claude">Claude (유료 · 소액 과금)</option>
      <option value="gemini">Gemini (무료)</option>
    </select>
  </label>
  <label class="field">
    <span>Claude API 키</span>
    <input type="password" id="input-apikey" placeholder="sk-ant-...">
  </label>
  <label class="field">
    <span>Gemini API 키</span>
    <input type="password" id="input-geminikey" placeholder="AIza...">
  </label>
  <label class="field" id="field-korean-voice-browser">
    <span>한국어 음성</span>
    <select id="input-korean-voice"></select>
    <button type="button" id="btn-preview-korean" class="ctl-btn">미리듣기</button>
  </label>
  <label class="field" id="field-english-voice-browser">
    <span>영어 음성</span>
    <select id="input-english-voice"></select>
    <button type="button" id="btn-preview-english" class="ctl-btn">미리듣기</button>
  </label>
  <label class="field">
    <span>TTS 음성 소스</span>
    <select id="input-tts-engine">
      <option value="browser">브라우저 내장 (무료)</option>
      <option value="google">Google Cloud TTS (자연스러운 음성)</option>
    </select>
  </label>
  <label class="field" id="field-google-tts-key">
    <span>Google Cloud TTS API 키</span>
    <input type="password" id="input-google-tts-key" placeholder="AIza...">
  </label>
  <label class="field" id="field-korean-voice-google">
    <span>한국어 음성 (Google)</span>
    <select id="input-google-korean-voice"></select>
    <button type="button" id="btn-preview-google-korean" class="ctl-btn">미리듣기</button>
  </label>
  <label class="field" id="field-english-voice-google">
    <span>영어 음성 (Google)</span>
    <select id="input-google-english-voice"></select>
    <button type="button" id="btn-preview-google-english" class="ctl-btn">미리듣기</button>
  </label>
  <label class="field">
    <span id="day-range-label">현재 Day</span>
    <input type="number" id="input-day" min="1">
  </label>
  <label class="field">
    <span>아침 알림</span>
    <button type="button" id="btn-enable-push" class="ctl-btn">알림 켜기</button>
  </label>
  <div id="push-sub-area" class="hidden">
    <p style="font-size:13px;color:#9aa3c0">아래 내용을 복사해서 개발자에게 전달해주세요 (최초 1회만 필요).</p>
    <textarea id="push-sub-output" readonly rows="4" style="width:100%;font-size:11px"></textarea>
    <button type="button" id="btn-copy-sub" class="ctl-btn">복사</button>
  </div>
  <button id="btn-settings-save" class="big-btn">저장</button>
  <button id="btn-reset" class="ctl-btn danger" style="margin-top:24px">학습 기록 전체 초기화</button>
</div>

<script src="push-config.js"></script>
<script src="patterns.js"></script>
<script src="day-tasks.js"></script>
<script src="app.js"></script>
</body>
</html>
